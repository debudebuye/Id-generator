<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Format Display Test</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #07813a;
            --primary-dark: #056830;
            --primary-light: #e6f4ea;
            --accent: #f0b429;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --border: #e0e0e0;
            --bg-light: #f5f7fa;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text);
            line-height: 1.6;
            padding: 2rem;
        }

        .form-card {
            background: white;
            border-radius: 12px;
            padding: 1.75rem;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border);
            max-width: 400px;
            margin: 0 auto;
        }

        .form-card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-card-title i {
            color: var(--accent);
        }

        .checkbox-container {
            margin-bottom: 1rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            padding-left: 35px;
            user-select: none;
            margin-bottom: 0.75rem;
        }

        .styled-checkbox {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 24px;
            width: 24px;
            background-color: white;
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: var(--transition);
        }

        .checkbox-label .styled-checkbox:checked~.checkmark {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }

        .checkbox-label .styled-checkbox:checked~.checkmark:after {
            display: block;
        }

        .checkbox-label .checkmark:after {
            left: 8px;
            top: 4px;
            width: 6px;
            height: 11px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .option-text {
            margin-left: 10px;
            font-size: 0.95rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-text i {
            color: var(--primary);
            width: 18px;
            text-align: center;
        }

        .checkbox-container:has(input[name="city_type"]:checked) {
            background-color: var(--primary-light);
            border-radius: 8px;
            padding: 0.5rem;
            margin: 0.5rem 0;
            border: 1px solid var(--primary);
            transition: all 0.3s ease;
        }

        .styled-checkbox:disabled {
            cursor: not-allowed;
        }

        .checkbox-label:has(.styled-checkbox:disabled) {
            cursor: not-allowed;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="form-card">
        <h3 class="form-card-title">
            <i class="fas fa-city"></i> Address Format
        </h3>
        
        <!-- Automatic detection message -->
        <div style="background-color: var(--primary-light); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; border-left: 3px solid var(--primary);">
            <div style="font-size: 0.85rem; color: var(--primary-dark); font-weight: 500; line-height: 1.4;">
                <i class="fas fa-magic" style="color: var(--primary); margin-right: 0.5rem;"></i>
                Automatic format detection and FIN extraction for ~1.8-1.9 MB PDFs only - Other PDF sizes require manual FIN entry
            </div>
        </div>

        <!-- Selected address format display -->
        <div class="checkbox-container" style="background-color: var(--primary-light); border: 1px solid var(--primary);">
            <label class="checkbox-label">
                <input type="checkbox" name="city_type" value="default" class="styled-checkbox" checked disabled>
                <span class="checkmark"></span>
                <span class="option-text">
                    <i class="fas fa-home"></i> Default Address
                    <span style="font-size: 0.75rem; color: var(--primary); margin-left: 8px; font-weight: 600;">
                        (Selected)
                    </span>
                </span>
            </label>
        </div>

        <div class="checkbox-container" style="display: none;">
