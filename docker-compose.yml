services:
  web:
    build: .
    container_name: id-card-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/apidocs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
