<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Image Cropper</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .upload-btn {
      padding: 10px 20px;
      background: #07813a;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .upload-btn:hover {
      background: #056830;
    }
    .preview {
      margin-top: 20px;
      border: 2px solid #ddd;
      padding: 10px;
      min-height: 200px;
    }
    .crop-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
    }
    .crop-modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .crop-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 90%;
      max-height: 90%;
    }
    .crop-image-container {
      max-height: 500px;
      margin: 20px 0;
    }
    .crop-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .crop-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .crop-btn-primary {
      background: #07813a;
      color: white;
    }
    .crop-btn-secondary {
      background: #7f8c8d;
      color: white;
    }
    h1 {
      color: #07813a;
    }
    .status {
      margin-top: 10px;
      padding: 10px;
      background: #e6f4ea;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>🖼️ Image Cropper Test</h1>
  <p>Test the image cropping functionality before integrating</p>
  
  <button class="upload-btn" onclick="document.getElementById('testInput').click()">
    📤 Upload Image
  </button>
  <input type="file" id="testInput" accept="image/*" style="display: none;">
  
  <div class="status" id="status"></div>
  
  <div class="preview" id="preview">
    <p style="color: #7f8c8d; text-align: center;">No image uploaded yet</p>
  </div>

  <!-- Crop Modal -->
  <div class="crop-modal" id="cropModal">
    <div class="crop-container">
      <h2>Crop Your Image</h2>
      <div class="crop-image-container">
        <img id="cropImage" src="" alt="Image to crop">
      </div>
      <div class="crop-controls">
        <button class="crop-btn crop-btn-secondary" onclick="rotateCrop(-90)">↶ Rotate Left</button>
        <button class="crop-btn crop-btn-secondary" onclick="rotateCrop(90)">↷ Rotate Right</button>
        <button class="crop-btn crop-btn-secondary" onclick="resetCrop()">🔄 Reset</button>
        <button class="crop-btn crop-btn-secondary" onclick="closeCrop()">❌ Cancel</button>
        <button class="crop-btn crop-btn-primary" onclick="applyCrop()">✓ Apply Crop</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <script>
    let cropper = null;

    document.getElementById('testInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        showStatus('Please select a valid image file', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        openCropModal(e.target.result);
      };
      reader.readAsDataURL(file);
    });

    function openCropModal(imageSrc) {
      const modal = document.getElementById('cropModal');
      const cropImage = document.getElementById('cropImage');
      
      cropImage.src = imageSrc;
      modal.classList.add('active');

      if (cropper) {
        cropper.destroy();
      }

      cropper = new Cropper(cropImage, {
        aspectRatio: 1,
        viewMode: 1,
        dragMode: 'move',
        autoCropArea: 0.8,
        restore: false,
        guides: true,
        center: true,
        highlight: false,
        cropBoxMovable: true,
        cropBoxResizable: true,
      });

      showStatus('Image loaded! Adjust the crop area and click Apply', 'success');
    }

    function closeCrop() {
      const modal = document.getElementById('cropModal');
      modal.classList.remove('active');
      
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }

      document.getElementById('testInput').value = '';
    }

    function rotateCrop(degree) {
      if (cropper) {
        cropper.rotate(degree);
      }
    }

    function resetCrop() {
      if (cropper) {
        cropper.reset();
      }
    }

    function applyCrop() {
      if (!cropper) return;

      const canvas = cropper.getCroppedCanvas({
        maxWidth: 800,
        maxHeight: 800,
        fillColor: '#fff',
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high',
      });

      const croppedImageData = canvas.toDataURL('image/jpeg', 0.9);

      // Show preview
      const preview = document.getElementById('preview');
      preview.innerHTML = `
        <img src="${croppedImageData}" style="max-width: 100%; height: auto;">
        <p style="margin-top: 10px; color: #07813a;">✓ Image cropped successfully!</p>
      `;

      showStatus('Crop applied successfully! Image size: ' + formatBytes(croppedImageData.length), 'success');

      closeCrop();
    }

    function showStatus(message, type) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.style.display = 'block';
      status.style.background = type === 'error' ? '#ffe6e6' : '#e6f4ea';
      status.style.color = type === 'error' ? '#e74c3c' : '#07813a';
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' bytes';
      else if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      else return (bytes / 1048576).toFixed(1) + ' MB';
    }

    // Close modal on escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && document.getElementById('cropModal').classList.contains('active')) {
        closeCrop();
      }
    });
  </script>
</body>
</html>
