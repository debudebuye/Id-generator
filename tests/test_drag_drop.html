<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Drag and Drop</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background: #f5f5f5;
    }

    .drop-zone {
      width: 300px;
      height: 200px;
      border: 3px dashed #ccc;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 1rem;
      background: white;
      transition: all 0.3s;
      position: relative;
    }

    .drop-zone.dragover {
      border-color: #07813a;
      background: #e6f4ea;
      transform: scale(1.02);
    }

    .drop-zone-text {
      text-align: center;
      color: #666;
    }

    .drop-zone.dragover .drop-zone-text {
      color: #07813a;
      font-weight: bold;
    }

    .preview {
      max-width: 300px;
      margin: 1rem;
    }

    .preview img {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .status {
      padding: 1rem;
      margin: 1rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .success {
      color: #07813a;
      font-weight: bold;
    }

    .error {
      color: #e74c3c;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Drag and Drop Test</h1>
  <p>Drag an image file into the box below to test drag-and-drop functionality.</p>

  <div class="drop-zone" id="dropZone">
    <div class="drop-zone-text">
      <p>📁 Drop Image Here</p>
      <small>or click to select</small>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" style="display: none;">

  <div class="status" id="status">
    <p>Status: Waiting for file...</p>
  </div>

  <div class="preview" id="preview"></div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');

    // Prevent default drag behaviors
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      document.body.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    // Highlight drop zone when dragging over it
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, function() {
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, function() {
        dropZone.classList.remove('dragover');
      }, false);
    });

    // Handle dropped files
    dropZone.addEventListener('drop', function(e) {
      const dt = e.dataTransfer;
      const files = dt.files;

      if (files.length > 0) {
        handleFile(files[0]);
      }
    }, false);

    // Click to select file
    dropZone.addEventListener('click', function() {
      fileInput.click();
    });

    fileInput.addEventListener('change', function(e) {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    function handleFile(file) {
      // Check if it's an image
      if (!file.type.startsWith('image/')) {
        status.innerHTML = '<p class="error">❌ Error: Please drop an image file</p>';
        return;
      }

      status.innerHTML = `<p class="success">✅ Success: ${file.name} (${formatBytes(file.size)})</p>`;

      // Show preview
      const reader = new FileReader();
      reader.onload = function(e) {
        preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
      };
      reader.readAsDataURL(file);
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }
  </script>
</body>
</html>
